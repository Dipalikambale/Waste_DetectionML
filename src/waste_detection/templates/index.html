<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Waste Detection</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #f2f6f4; color: #18352a; }
      main { max-width: 880px; margin: 48px auto; padding: 28px; background: white; border-radius: 16px; box-shadow: 0 8px 28px #18352a16; }
      h1 { margin-top: 0; }
      form { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 24px 0; }
      button { padding: 10px 18px; border: 0; border-radius: 8px; background: #147d52; color: white; font: inherit; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      #status { min-height: 1.5em; color: #52635b; }
      #preview { display: block; max-width: 100%; height: auto; border-radius: 10px; }
      #results { padding-left: 20px; }
      .muted { color: #52635b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Waste Detection</h1>
      <p class="muted">Upload an image to detect and classify waste items.</p>
      <form id="upload-form">
        <input id="image-file" type="file" accept="image/*" required>
        <button id="submit" type="submit">Detect waste</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <canvas id="preview" hidden></canvas>
      <ul id="results"></ul>
    </main>
    <script>
      const form = document.querySelector("#upload-form");
      const input = document.querySelector("#image-file");
      const button = document.querySelector("#submit");
      const status = document.querySelector("#status");
      const canvas = document.querySelector("#preview");
      const resultsList = document.querySelector("#results");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!input.files.length) return;
        button.disabled = true;
        status.textContent = "Running detection…";
        resultsList.replaceChildren();
        canvas.hidden = true;
        const formData = new FormData();
        formData.append("image", input.files[0]);
        try {
          const response = await fetch("/api/predict", { method: "POST", body: formData });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Detection request failed");
          const image = new Image();
          image.onload = () => {
            const scale = Math.min(1, 1200 / image.width);
            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);
            canvas.hidden = false;
            const context = canvas.getContext("2d");
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            context.lineWidth = Math.max(2, 3 * scale);
            context.font = `${Math.max(13, 16 * scale)}px system-ui`;
            data.detections.forEach((detection) => {
              const [x1, y1, x2, y2] = detection.box.map((value) => value * scale);
              const label = `${detection.class_name} ${(detection.confidence * 100).toFixed(1)}%`;
              context.strokeStyle = "#13a86b";
              context.fillStyle = "#13a86b";
              context.strokeRect(x1, y1, x2 - x1, y2 - y1);
              const labelWidth = context.measureText(label).width + 10;
              context.fillRect(x1, Math.max(0, y1 - 24), labelWidth, 24);
              context.fillStyle = "white";
              context.fillText(label, x1 + 5, Math.max(17, y1 - 7));
              const item = document.createElement("li");
              item.textContent = `${detection.class_name} — ${(detection.confidence * 100).toFixed(1)}% confidence`;
              resultsList.append(item);
            });
            if (!data.detections.length) {
              const item = document.createElement("li");
              item.textContent = "No waste objects detected.";
              resultsList.append(item);
            }
            status.textContent = `${data.detections.length} object(s) detected.`;
          };
          image.onerror = () => { status.textContent = "Could not render the uploaded image."; };
          image.src = `data:image/jpeg;base64,${data.image}`;
        } catch (error) {
          status.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
